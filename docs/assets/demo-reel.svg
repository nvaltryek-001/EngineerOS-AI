    <text x="226" y="102" fill="#0f172a" font-size="22" font-weight="800">Coding Practice</text>
    <rect x="226" y="118" width="300" height="356" rx="12" fill="#fff"/>
    <text x="244" y="146" fill="#0f172a" font-size="15" font-weight="700">1. Two Sum</text>
    <rect x="410" y="132" width="50" height="20" rx="10" fill="#dcfce7"/><text x="420" y="146" fill="#15803d" font-size="11">Easy</text>
    <g fill="#475569" font-size="11">
      <text x="244" y="176">Given an array of integers nums and an</text>
      <text x="244" y="194">integer target, return indices of the two</text>
      <text x="244" y="212">numbers such that they add up to target.</text>
      <text x="244" y="246" fill="#0f172a" font-weight="700">Example 1:</text>
      <text x="244" y="266">Input: nums = [2,7,11,15], target = 9</text>
      <text x="244" y="284">Output: [0,1]</text>
    </g>
    <rect x="540" y="118" width="368" height="300" rx="12" fill="#0f172a"/>
    <text x="558" y="142" fill="#94a3b8" font-size="11">solution.ts</text>
    <g font-family="Consolas, Menlo, monospace" font-size="12">
      <text x="558" y="174" fill="#c084fc">function <tspan fill="#60a5fa">twoSum</tspan><tspan fill="#e2e8f0">(nums, target) {</tspan></text>
      <text x="576" y="196" fill="#c084fc">const <tspan fill="#e2e8f0">seen = </tspan><tspan fill="#c084fc">new </tspan><tspan fill="#facc15">Map</tspan><tspan fill="#e2e8f0">();</tspan></text>
      <text x="576" y="218" fill="#c084fc">for <tspan fill="#e2e8f0">(let i = 0; i &lt; nums.length; i++) {</tspan></text>
      <text x="594" y="240" fill="#c084fc">const <tspan fill="#e2e8f0">need = target - nums[i];</tspan></text>
      <text x="594" y="262" fill="#c084fc">if <tspan fill="#e2e8f0">(seen.has(need))</tspan></text>
      <text x="612" y="282" fill="#c084fc">return <tspan fill="#e2e8f0">[seen.get(need), i];</tspan></text>
      <text x="594" y="304" fill="#e2e8f0">seen.set(nums[i], i);</text>
      <text x="576" y="326" fill="#e2e8f0">}</text>
      <text x="558" y="348" fill="#e2e8f0">}</text>
    </g>
    <rect x="558" y="362" width="2" height="16" fill="#60a5fa" class="blink"/>
    <rect x="540" y="430" width="368" height="44" rx="12" fill="#dcfce7" class="pop"/>
    <text x="560" y="457" fill="#15803d" font-size="13" font-weight="700" class="pop">✓ Accepted · logged to your Coding progress</text>
  </g>

