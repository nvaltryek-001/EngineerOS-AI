    <style>
      .sc { opacity: 0; animation: show 18s linear infinite; }
      .k0 { animation-delay: 0s; }
      .k1 { animation-delay: -15s; }
      .k2 { animation-delay: -12s; }
      .k3 { animation-delay: -9s; }
      .k4 { animation-delay: -6s; }
      .k5 { animation-delay: -3s; }
      @keyframes show { 0% { opacity: 0; } 2% { opacity: 1; } 15% { opacity: 1; } 17% { opacity: 0; } 100% { opacity: 0; } }
      .bar  { animation: bar 3s linear infinite; }
      @keyframes bar { from { width: 0; } to { width: 700px; } }
      .grow { animation: grow 3s ease-out infinite; transform-box: fill-box; transform-origin: left; }
      @keyframes grow { 0% { transform: scaleX(0); } 40%,100% { transform: scaleX(1); } }
      .gauge { stroke-dasharray: 0 400; animation: gauge 3s ease-out infinite; }
      @keyframes gauge { 0% { stroke-dasharray: 0 400; } 50%,100% { stroke-dasharray: 260 400; } }
      .pop  { animation: pop 3s ease-out infinite; }
      @keyframes pop { 0%,30% { opacity: 0; } 45%,100% { opacity: 1; } }
      .blink { animation: blink 1s steps(2) infinite; }
      @keyframes blink { to { opacity: 0; } }
    </style>
  </defs>

